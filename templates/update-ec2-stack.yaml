AWSTemplateFormatVersion: '2010-09-09'
Description: Update EC2 stack with an additional security group resource

Resources:
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to the EC2 instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-08e3b3155fc937a94
      InstanceType: t3.small
      SecurityGroupIds:
        - !GetAtt MySecurityGroup.GroupId
